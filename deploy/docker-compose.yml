services:
  web:
    image: gufalcon/overmind-gui:latest
    container_name: overmind-gui
    restart: always
    ports:
      - "1880:80"
      - "18443:443"
    environment:
      - HTTP_PORT=80
      - HTTP_HOST=0.0.0.0
      - NGINX_ENVSUBST_OUTPUT_DIR=/usr/share/nginx/html
      - MUSIC_ASSISTANT_TOKEN=${MUSIC_ASSISTANT_TOKEN:-}
    volumes:
      - "/app/deploy/overmind-gui/nginx.conf:/etc/nginx/nginx.conf"
      - "/app/deploy/overmind-gui/overmind-config.js.template:/etc/nginx/templates/overmind-config.js.template"
    command: ["nginx", "-g", "daemon off;"]
    labels:
      - traefik.enable=true
      - traefik.http.routers.overmind-gui.rule=Host(`overmind.unterrainer.info`)
      - traefik.http.routers.overmind-gui.middlewares=std-headers@file,https-redirect@file
      - traefik.http.services.overmind-gui.loadbalancer.server.port=80

networks:
  default:
    name: proxy_default
    external: true
